name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run linting
        run: flake8 .

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t Homework_module_8 .

  test:
    runs-on: ubuntu-latest
    needs: [lint, docker-build]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create .env for tests
      run: |
        echo "SECRET_KEY=test-secret-key-for-ci" > .env  # Dummy key for tests only
        echo "DEBUG=True" >> .env
        echo "ALLOWED_HOSTS=localhost,127.0.0.1" >> .env
        echo "DB_NAME=test_db" >> .env
        echo "DB_USER=" >> .env  # Empty for SQLite
        echo "DB_PASSWORD=" >> .env
        echo "DB_HOST=" >> .env
        echo "DB_PORT=" >> .env

    - name: Run tests
      run: |
        python manage.py test

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, docker-build, test]
    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/homework_module_8
          git pull origin master
          docker compose -f docker-compose.yaml down
          docker compose -f docker-compose.yaml build --no-cache
          docker compose -f docker-compose.yaml up -d
          docker compose -f docker-compose.yaml logs web
          sudo systemctl restart nginx
